services:
  - type: web
    name: tobe-nexus
    runtime: node
    region: singapore
    buildCommand: "npm install -g pnpm && pnpm install && pnpm --filter @workspace/tobe-nexus run build"
    startCommand: "pnpm --filter @workspace/tobe-nexus run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
